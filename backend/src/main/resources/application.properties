spring.application.name=careerpilot
server.port=8080
careerpilot.jwt.secret=${CAREERPILOT_JWT_SECRET:careerpilot-local-development-secret-change-before-deployment-2026}
careerpilot.cors.allowed-origin=${CAREERPILOT_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Local development defaults: H2 database saved to a file so data persists across app restarts.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/careerpilot;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO